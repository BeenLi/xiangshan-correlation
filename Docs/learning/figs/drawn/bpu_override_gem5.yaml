title: "XS-GEM5 DecoupledBPUWithFTB：同拍算完、事后补空泡（decoupled_bpred.cc）"
# 两个队列：FSQ（fsq_size=64，decoupled_bpred.hh:355 满则不再预测，提交时出队 decoupled_bpred.cc:1817）
# 和 FTQ（ftq_size=128，tryEnqFetchTarget 从 FSQ 逐个流搬入，decoupled_bpred.cc:2233-2317）。
nodes:
  - {id: s0pc, type: reg, label: "s0PC + s0History"}
  - {id: put, type: block, label: "putPCHistory()\n同一 tick 查全部三级", hl: true}
  - {id: p0, type: table, label: "predsOfEachStage[0]\nuFTB / uRAS", fields: ["valid", "ftbEntry", "target"], row: 0, col: 2}
  - {id: p1, type: table, label: "predsOfEachStage[1]\nTAGE / FTB / RAS", fields: ["valid", "ftbEntry", "target"], row: 1, col: 2}
  - {id: p2, type: table, label: "predsOfEachStage[2]\nITTAGE", fields: ["valid", "ftbEntry", "target"], row: 2, col: 2}
  - {id: gen, type: block, label: "generateFinalPredAndCreateBubbles()\n下一 tick 开头执行\n从后往前取第一个 valid 为最终\n从前往后数第一个 match() 的级号", hl: true, col: 3}
  - {id: bub, type: reg, label: "numOverrideBubbles", col: 4, row: 1}
  - {id: enq, type: block, label: "tryEnqFetchStream()\n空泡归零才入队", col: 5}
  - {id: fsq, type: fifo, label: "FSQ 64 项\n预测→提交", col: 6, bold: true}
  - {id: enqt, type: block, label: "tryEnqFetchTarget()\n每个流一项", col: 7}
  - {id: ftq, type: fifo, label: "FTQ 128 项\n未取的块", col: 8}
  - {id: fetch, type: block, label: "fetch stage", col: 9}
edges:
  - "s0pc -> put"
  - "put -> p0"
  - "put -> p1"
  - "put -> p2"
  - "p0 -> gen"
  - "p1 -> gen"
  - "p2 -> gen"
  - "gen -> bub : first_hit_stage (0/1/2)"
  - "gen -> enq : finalPred"
  - "bub ~> enq : >0 则等待 | hl"
  - "enq -> fsq : 只见最终结果"
  - "fsq -> enqt"
  - "enqt -> ftq"
  - "ftq -> fetch"
  - "enq ~> s0pc : receivedPred=false, 下一块 | fb"
legend: {fb: 下一拍, ctrl: 控制, hl: 关键步骤}
